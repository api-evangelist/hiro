  /extended/v1/block/{hash}:
    get:
      operationId: get_block_by_hash
      summary: Get block by hash
      tags:
      - Blocks
      description: "**NOTE:** This endpoint is deprecated in favor of [Get block](/api/get-block).\n        \n        Retrieves block details of a specific block for a given chain height. You can use the hash from your latest block ('get_block_list' API) to get your block details."
      parameters:
      - schema:
          type: string
        example: '0x4839a8b01cfb39ffcc0d07d3db31e848d5adf5279d529ed5062300b9f353ff79'
        in: path
        name: hash
        required: true
        description: Hash of the block
      deprecated: true
      responses:
        '200':
          description: A block
          content:
            application/json:
              schema:
                title: Block
                description: A block
                type: object
                properties:
                  canonical:
                    description: Set to `true` if block corresponds to the canonical chain tip
                    type: boolean
                  height:
                    description: Height of the block
                    type: integer
                  hash:
                    description: Hash representing the block
                    type: string
                  block_time:
                    description: Unix timestamp (in seconds) indicating when this block was mined.
                    type: number
                  block_time_iso:
                    description: An ISO 8601 (YYYY-MM-DDTHH:mm:ss.sssZ) indicating when this block was mined.
                    type: string
                  tenure_height:
                    description: The tenure height (AKA coinbase height) of this block
                    type: integer
                  index_block_hash:
                    description: The only hash that can uniquely identify an anchored block or an unconfirmed state trie
                    type: string
                  parent_block_hash:
                    description: Hash of the parent block
                    type: string
                  burn_block_time:
                    description: Unix timestamp (in seconds) indicating when this block was mined.
                    type: number
                  burn_block_time_iso:
                    description: An ISO 8601 (YYYY-MM-DDTHH:mm:ss.sssZ) indicating when this block was mined.
