                          recipient:
                            type: string
                          event_index:
                            type: integer
                          asset_event_type:
                            type: string
                          tx_id:
                            type: string
                        required:
                        - event_index
                        - asset_event_type
                        - tx_id
                      - title: NonFungibleTokenHistoryEventWithTxMetadata
                        description: Non-Fungible Token history event with transaction metadata
