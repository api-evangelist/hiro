                                                  repr:
                                                    type: string
                                                required:
                                                - hex
                                                - repr
                                            required:
                                            - asset_event_type
                                            - asset_id
                                            - sender
                                            - recipient
                                            - value
                                        required:
                                        - event_type
                                        - tx_id
                                        - asset
                                tx_type:
                                  type: string
                                  enum:
                                  - token_transfer
                                token_transfer:
                                  type: object
                                  properties:
                                    recipient_address:
                                      type: string
                                    amount:
                                      description: Transfer amount as Integer string (64-bit unsigned integer)
                                      type: string
                                    memo:
                                      description: Hex encoded arbitrary message, up to 34 bytes length (should try decoding to an ASCII string)
                                      type: string
                                  required:
                                  - recipient_address
                                  - amount
                                  - memo
                              required:
                              - tx_id
                              - nonce
                              - fee_rate
                              - sender_address
                              - sponsored
                              - post_condition_mode
