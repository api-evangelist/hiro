                                              sender:
                                                type: string
                                              recipient:
                                                type: string
                                              amount:
                                                type: string
                                              memo:
                                                type: string
                                            required:
                                            - asset_event_type
                                            - sender
                                            - recipient
                                            - amount
                                        required:
                                        - event_type
                                        - tx_id
                                        - asset
                                    - title: FungibleTokenAssetTransactionEvent
                                      type: object
                                      allOf:
                                      - title: AbstractTransactionEvent
                                        type: object
                                        properties:
                                          event_index:
                                            type: integer
                                        required:
                                        - event_index
                                      - type: object
                                        properties:
                                          event_type:
                                            type: string
                                            enum:
                                            - fungible_token_asset
                                          tx_id:
                                            type: string
                                          asset:
                                            type: object
                                            properties:
                                              asset_event_type:
                                                anyOf:
                                                - type: string
                                                  enum:
                                                  - transfer
                                                - type: string
