                                          tx_id:
                                            type: string
                                          stx_lock_event:
                                            type: object
                                            properties:
                                              locked_amount:
                                                type: string
                                              unlock_height:
                                                type: integer
                                              locked_address:
                                                type: string
                                            required:
                                            - locked_amount
                                            - unlock_height
                                            - locked_address
                                        required:
                                        - event_type
                                        - tx_id
                                        - stx_lock_event
